<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Byte | Programming mentor</title>
    <style>
      :root {
        --bg: #f2f4f8;
        --surface: #ffffff;
        --ink: #0e1a2b;
        --muted: #5b6b80;
        --line: #dde3ec;
        --accent: #2748d8;
        --accent-ink: #ffffff;
        --accent-soft: #e6ebfd;
        --me-bg: #2f4fdc;
        --me-ink: #ffffff;
        --code-bg: #0e1a2b;
        --code-ink: #dfe7f5;
        --code-line: #26344d;
        --inline-code: #eaeef6;
        --err-bg: #fdecec;
        --err: #a12a2a;
        --side-bg: #0e1a2b;
        --side-ink: #e8eefa;
        --side-muted: #8fa1bd;
        --side-line: #22314b;
        --side-hover: #17263f;
        --ok: #2fbf8f;
        --warn: #e0a52e;
        --sans:
          "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system,
          "Helvetica Neue", Arial, sans-serif;
        --mono:
          "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, Menlo,
          monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b1220;
          --surface: #121c30;
          --ink: #e6ecf7;
          --muted: #93a3bb;
          --line: #22304a;
          --accent: #7f99ff;
          --accent-ink: #0b1220;
          --accent-soft: #1a2748;
          --code-bg: #070d18;
          --inline-code: #1b2740;
          --err-bg: #3a1f22;
          --err: #f4b0b0;
          --side-bg: #0a1424;
          --side-hover: #121f36;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b1220;
        --surface: #121c30;
        --ink: #e6ecf7;
        --muted: #93a3bb;
        --line: #22304a;
        --accent: #7f99ff;
        --accent-ink: #0b1220;
        --accent-soft: #1a2748;
        --code-bg: #070d18;
        --inline-code: #1b2740;
        --err-bg: #3a1f22;
        --err: #f4b0b0;
        --side-bg: #0a1424;
        --side-hover: #121f36;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15.5px/1.6 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .app {
        display: grid;
        grid-template-columns: 290px 1fr;
        height: 100%;
        height: 100dvh;
      }

      /* ---------- Sidebar ---------- */
      aside {
        background: var(--side-bg);
        color: var(--side-ink);
        display: flex;
        flex-direction: column;
        padding: 22px 16px 16px;
        gap: 22px;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 6px;
      }
      .logo {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--accent);
        color: var(--accent-ink);
        display: grid;
        place-items: center;
        font: 700 17px/1 var(--mono);
        letter-spacing: -0.04em;
        flex: none;
      }
      .brand h1 {
        margin: 0;
        font: 700 1.15rem/1.2 var(--mono);
        letter-spacing: -0.02em;
      }
      .brand p {
        margin: 2px 0 0;
        color: var(--side-muted);
        font-size: 0.8rem;
        line-height: 1.3;
      }

      .new-chat {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 14px;
        border-radius: 10px;
        background: transparent;
        border: 1px solid var(--side-line);
        color: var(--side-ink);
        font-weight: 600;
        font-size: 0.92rem;
        text-align: left;
      }
      .new-chat:hover {
        background: var(--side-hover);
        border-color: #34486a;
      }
      .new-chat svg {
        flex: none;
      }

      .side-section h2 {
        margin: 0 0 8px;
        padding: 0 6px;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--side-muted);
      }
      .starters {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .starter {
        text-align: left;
        background: none;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        color: var(--side-ink);
        font-size: 0.88rem;
        line-height: 1.4;
      }
      .starter:hover {
        background: var(--side-hover);
      }

      .memory {
        border: 1px solid var(--side-line);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.84rem;
      }
      .memory .row-line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--side-muted);
      }
      .memory .row-line + .row-line {
        margin-top: 6px;
      }
      .memory strong {
        color: var(--side-ink);
        font-weight: 600;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        color: var(--side-ink);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
      }
      .dot.warn {
        background: var(--warn);
      }

      .side-foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 6px;
        color: var(--side-muted);
        font-size: 0.78rem;
      }
      .icon-btn {
        background: none;
        border: 1px solid var(--side-line);
        border-radius: 8px;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        color: var(--side-ink);
      }
      .icon-btn:hover {
        background: var(--side-hover);
      }

      /* ---------- Main ---------- */
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--bg);
      }
      #scroll {
        flex: 1;
        overflow-y: auto;
        scroll-behavior: smooth;
      }
      .thread {
        max-width: 780px;
        margin: 0 auto;
        padding: 32px 24px 12px;
        display: flex;
        flex-direction: column;
        gap: 26px;
      }

      .empty {
        text-align: left;
        padding: 9vh 0 4vh;
      }
      .empty h2 {
        margin: 0 0 10px;
        font-size: clamp(1.7rem, 4vw, 2.4rem);
        line-height: 1.15;
        letter-spacing: -0.025em;
        font-weight: 700;
      }
      .empty p {
        margin: 0;
        max-width: 52ch;
        color: var(--muted);
        font-size: 1.02rem;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 26px;
      }
      .chip {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 9px 16px;
        font-size: 0.9rem;
        color: var(--ink);
      }
      .chip:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .row {
        display: flex;
        gap: 14px;
      }
      .row.me {
        justify-content: flex-end;
      }
      .bubble {
        max-width: min(82%, 600px);
        background: var(--me-bg);
        color: var(--me-ink);
        padding: 11px 16px;
        border-radius: 16px 16px 4px 16px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        flex: none;
        margin-top: 2px;
        background: var(--accent);
        color: var(--accent-ink);
        display: grid;
        place-items: center;
        font: 700 14px/1 var(--mono);
      }
      .body {
        min-width: 0;
        flex: 1;
      }
      .who {
        font-weight: 700;
        font-size: 0.86rem;
        margin-bottom: 3px;
      }
      .content > * + * {
        margin-top: 12px;
      }
      .content p {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .content h4 {
        margin: 18px 0 0;
        font-size: 1rem;
      }
      .content ul,
      .content ol {
        margin: 0;
        padding-left: 1.4em;
      }
      .content li + li {
        margin-top: 4px;
      }
      .content code {
        font: 0.87em var(--mono);
        background: var(--inline-code);
        padding: 2px 6px;
        border-radius: 5px;
      }

      .code {
        border-radius: 12px;
        overflow: hidden;
        background: var(--code-bg);
        border: 1px solid var(--code-line);
      }
      .code-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 8px 6px 14px;
        border-bottom: 1px solid var(--code-line);
        color: #9db0cf;
        font: 0.78rem var(--mono);
      }
      .copy {
        background: none;
        border: 1px solid transparent;
        border-radius: 6px;
        color: #b8c7e2;
        padding: 3px 10px;
        font: 0.78rem var(--sans);
      }
      .copy:hover {
        border-color: var(--code-line);
        color: #fff;
      }
      .code pre {
        margin: 0;
        padding: 14px 16px;
        overflow-x: auto;
        color: var(--code-ink);
        font: 0.86rem/1.6 var(--mono);
      }
      .code pre code {
        background: none;
        padding: 0;
        font: inherit;
      }

      .typing {
        display: inline-flex;
        gap: 5px;
        padding: 8px 0;
      }
      .typing i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        animation: blink 1.2s infinite ease-in-out;
      }
      .typing i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .typing i {
          animation: none;
          opacity: 0.6;
        }
        #scroll {
          scroll-behavior: auto;
        }
      }

      .error {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: var(--err-bg);
        color: var(--err);
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 0.92rem;
      }
      .error button {
        background: none;
        border: 1px solid currentColor;
        border-radius: 8px;
        padding: 5px 14px;
        font-weight: 600;
        flex: none;
      }
      .notice {
        align-self: center;
        font-size: 0.82rem;
        color: var(--muted);
        background: var(--accent-soft);
        border-radius: 999px;
        padding: 5px 14px;
        text-align: center;
      }

      /* ---------- Composer ---------- */
      .composer-wrap {
        padding: 8px 24px 20px;
      }
      form {
        max-width: 780px;
        margin: 0 auto;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 8px 8px 8px 16px;
        box-shadow: 0 1px 2px rgba(14, 26, 43, 0.05);
      }
      form:focus-within {
        border-color: var(--accent);
      }
      textarea {
        flex: 1;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        padding: 8px 0;
        max-height: 160px;
        min-height: 28px;
      }
      textarea::placeholder {
        color: var(--muted);
      }
      #send {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 11px;
        background: var(--accent);
        color: var(--accent-ink);
        display: grid;
        place-items: center;
        flex: none;
      }
      #send:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .hint {
        max-width: 780px;
        margin: 8px auto 0;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 0.78rem;
        padding: 0 6px;
      }

      /* ---------- Small screens ---------- */
      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        aside {
          flex-direction: row;
          align-items: center;
          padding: 10px 14px;
          gap: 10px;
          overflow: visible;
        }
        .brand p,
        .side-section,
        .side-foot .meta {
          display: none;
        }
        .new-chat {
          width: auto;
          margin-left: auto;
          padding: 8px 12px;
        }
        .side-foot {
          margin: 0;
          padding: 0;
        }
        .thread {
          padding: 20px 16px 8px;
        }
        .composer-wrap {
          padding: 8px 12px 14px;
        }
        .bubble {
          max-width: 90%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand">
          <div class="logo" aria-hidden="true">B_</div>
          <div>
            <h1>Byte</h1>
            <p>Programming mentor</p>
          </div>
        </div>

        <button class="new-chat" id="newChat" type="button">
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M8 3v10M3 8h10" />
          </svg>
          New chat
        </button>

        <div class="side-section">
          <h2>Try asking</h2>
          <div class="starters" id="starters"></div>
        </div>

        <div class="side-section">
          <h2>Conversation memory</h2>
          <div class="memory">
            <div class="row-line">
              <span>Turns so far</span><strong id="turns">0</strong>
            </div>
            <div class="row-line">
              <span>Context</span>
              <span class="pill"
                ><span class="dot" id="memDot"></span
                ><span id="memText">Full history</span></span
              >
            </div>
          </div>
        </div>

        <div class="side-foot">
          <span class="meta">Powered by Gemini</span>
          <button
            class="icon-btn"
            id="theme"
            type="button"
            aria-label="Switch light or dark theme"
            title="Switch theme"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              aria-hidden="true"
            >
              <circle cx="8" cy="8" r="5.2" />
              <path d="M8 2.8v10.4" />
              <path d="M8 2.8a5.2 5.2 0 0 1 0 10.4z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </aside>

      <main>
        <div id="scroll">
          <div class="thread" id="thread" aria-live="polite"></div>
        </div>
        <div class="composer-wrap">
          <form id="form">
            <textarea
              id="input"
              rows="1"
              maxlength="4000"
              placeholder="Ask a programming question"
              aria-label="Message to Byte"
            ></textarea>
            <button id="send" type="submit" aria-label="Send message">
              <svg
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M9 14.5v-11M4.5 8 9 3.5 13.5 8" />
              </svg>
            </button>
          </form>
          <div class="hint">
            <span>Enter sends. Shift+Enter adds a line.</span
            ><span id="count"></span>
          </div>
        </div>
      </main>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const thread = $("thread"),
        scrollBox = $("scroll"),
        form = $("form"),
        input = $("input"),
        sendBtn = $("send");
      const STARTERS = [
        "Explain list comprehensions in Python",
        "Why does my loop never end?",
        "What is the difference between let and const?",
        "How do I read a file in Python?",
      ];
      const MAX_CHARS = 4000;

      let conversationId = null,
        lastText = "",
        turns = 0,
        summarised = false,
        busy = false;

      /* ----- tiny helpers ----- */
      function h(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }
      function toBottom() {
        scrollBox.scrollTop = scrollBox.scrollHeight;
      }

      /* ----- safe mini-markdown renderer (no innerHTML) ----- */
      function inline(parent, text) {
        text.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).forEach((tok) => {
          if (!tok) return;
          if (tok.startsWith("`") && tok.endsWith("`") && tok.length > 2)
            parent.appendChild(h("code", "", tok.slice(1, -1)));
          else if (tok.startsWith("**") && tok.endsWith("**") && tok.length > 4)
            parent.appendChild(h("strong", "", tok.slice(2, -2)));
          else parent.appendChild(document.createTextNode(tok));
        });
      }

      function renderText(parent, text) {
        let para = [],
          list = null;
        const flush = () => {
          if (para.length) {
            const p = h("p");
            inline(p, para.join(" "));
            parent.appendChild(p);
            para = [];
          }
        };
        text
          .replace(/\r/g, "")
          .split("\n")
          .forEach((line) => {
            const ul = line.match(/^\s*[-*\u2022]\s+(.*)/);
            const ol = line.match(/^\s*(\d+)[.)]\s+(.*)/);
            const hd = line.match(/^#{1,4}\s+(.*)/);
            if (ul || ol) {
              flush();
              const tag = ul ? "ul" : "ol";
              if (!list || list.tagName.toLowerCase() !== tag) {
                list = h(tag);
                if (ol && Number(ol[1]) > 1) list.start = Number(ol[1]);
                parent.appendChild(list);
              }
              const li = h("li");
              inline(li, ul ? ul[1] : ol[2]);
              list.appendChild(li);
            } else if (!line.trim()) {
              flush();
            } else if (hd) {
              flush();
              list = null;
              const t = h("h4");
              inline(t, hd[1]);
              parent.appendChild(t);
            } else {
              list = null;
              para.push(line.trim());
            }
          });
        flush();
      }

      function codeBlock(raw) {
        let lang = "code",
          body = raw;
        const m = raw.match(/^([\w+#.-]*)[ \t]*\n/);
        if (m) {
          lang = m[1] || "code";
          body = raw.slice(m[0].length);
        }
        body = body.replace(/\n$/, "");
        const wrap = h("div", "code");
        const head = h("div", "code-head");
        head.appendChild(h("span", "", lang));
        const copy = h("button", "copy", "Copy");
        copy.type = "button";
        copy.onclick = async () => {
          try {
            await navigator.clipboard.writeText(body);
            copy.textContent = "Copied";
          } catch {
            copy.textContent = "Press Ctrl+C";
          }
          setTimeout(() => (copy.textContent = "Copy"), 1600);
        };
        head.appendChild(copy);
        const pre = h("pre"),
          code = h("code", "", body);
        pre.appendChild(code);
        wrap.append(head, pre);
        return wrap;
      }

      function renderMarkdown(container, text) {
        text.split("```").forEach((part, i) => {
          if (i % 2) container.appendChild(codeBlock(part));
          else if (part.trim()) renderText(container, part);
        });
      }

      /* ----- thread rendering ----- */
      function clearEmpty() {
        const e = thread.querySelector(".empty");
        if (e) e.remove();
      }

      function addUser(text) {
        clearEmpty();
        const row = h("div", "row me");
        row.appendChild(h("div", "bubble", text));
        thread.appendChild(row);
        toBottom();
      }

      function addBot(text) {
        clearEmpty();
        const row = h("div", "row bot");
        row.appendChild(h("div", "avatar", "B"));
        const body = h("div", "body");
        body.appendChild(h("div", "who", "Byte"));
        const content = h("div", "content");
        if (text === null) {
          const t = h("div", "typing");
          t.append(h("i"), h("i"), h("i"));
          t.setAttribute("aria-label", "Byte is typing");
          content.appendChild(t);
        } else renderMarkdown(content, text);
        body.appendChild(content);
        row.appendChild(body);
        thread.appendChild(row);
        toBottom();
        return row;
      }

      function showError(message) {
        const box = h("div", "error");
        box.appendChild(h("span", "", message));
        const retry = h("button", "", "Retry");
        retry.type = "button";
        retry.onclick = () => {
          box.remove();
          send(lastText, true);
        };
        box.appendChild(retry);
        thread.appendChild(box);
        toBottom();
      }

      function showEmpty() {
        thread.textContent = "";
        const box = h("div", "empty");
        box.appendChild(h("h2", "", "What are you building today?"));
        box.appendChild(
          h(
            "p",
            "",
            "Ask about a bug, a concept, or a piece of code. Byte explains the why, then shows a short example.",
          ),
        );
        const chips = h("div", "chips");
        STARTERS.forEach((s) => {
          const c = h("button", "chip", s);
          c.type = "button";
          c.onclick = () => send(s);
          chips.appendChild(c);
        });
        box.appendChild(chips);
        thread.appendChild(box);
      }

      function updateMemory() {
        $("turns").textContent = String(turns);
        $("memDot").classList.toggle("warn", summarised);
        $("memText").textContent = summarised
          ? "Older turns summarised"
          : "Full history";
      }

      /* ----- talking to the backend ----- */
      async function send(text, isRetry = false) {
        if (busy) return;
        text = text.trim();
        if (!text) return;
        lastText = text;
        busy = true;
        sendBtn.disabled = true;
        if (!isRetry) addUser(text);
        const typingRow = addBot(null);
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              conversation_id: conversationId,
            }),
          });
          const data = await res.json().catch(() => ({}));
          typingRow.remove();
          if (!res.ok) {
            const detail =
              typeof data.detail === "string"
                ? data.detail
                : "Something went wrong. Please try again.";
            showError(detail);
            return;
          }
          conversationId = data.conversation_id;
          if (data.history_trimmed) {
            summarised = true;
            thread.appendChild(
              h(
                "div",
                "notice",
                "Older messages were summarised to stay within the model\u2019s context.",
              ),
            );
          }
          addBot(data.reply);
          turns += 1;
          updateMemory();
        } catch {
          typingRow.remove();
          showError(
            "Could not reach the server. Check that it is running, then retry.",
          );
        } finally {
          busy = false;
          sendBtn.disabled = false;
          input.focus();
        }
      }

      function newChat() {
        if (conversationId) {
          fetch("/reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ conversation_id: conversationId }),
          }).catch(() => {});
        }
        conversationId = null;
        turns = 0;
        summarised = false;
        lastText = "";
        updateMemory();
        showEmpty();
        input.focus();
      }

      /* ----- composer ----- */
      function autosize() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 160) + "px";
      }
      function updateCount() {
        const n = input.value.length;
        $("count").textContent =
          n > MAX_CHARS * 0.8 ? n + " / " + MAX_CHARS : "";
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value;
        if (!text.trim() || busy) return;
        input.value = "";
        autosize();
        updateCount();
        send(text);
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          form.requestSubmit();
        }
      });
      input.addEventListener("input", () => {
        autosize();
        updateCount();
      });

      /* ----- sidebar + theme ----- */
      STARTERS.forEach((s) => {
        const b = h("button", "starter", s);
        b.type = "button";
        b.onclick = () => send(s);
        $("starters").appendChild(b);
      });
      $("newChat").addEventListener("click", newChat);

      const root = document.documentElement;
      try {
        const saved = localStorage.getItem("byte-theme");
        if (saved) root.dataset.theme = saved;
      } catch {}
      $("theme").addEventListener("click", () => {
        const isDark = root.dataset.theme
          ? root.dataset.theme === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        root.dataset.theme = isDark ? "light" : "dark";
        try {
          localStorage.setItem("byte-theme", root.dataset.theme);
        } catch {}
      });

      showEmpty();
      updateMemory();
      input.focus();
    </script>
  </body>
</html>
